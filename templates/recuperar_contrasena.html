<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - GEORGE</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar.css') }}">
   
</head>

<body>

    <div class="recuperar-container">

        <div class="recuperar-card">

            <h1>Restablecer contraseña</h1>

            <p class="descripcion">
                Ingresa tu correo electrónico y crea una nueva contraseña.
            </p>

            <form method="POST">

                <div class="campo">
                    <label>Correo electrónico</label>

                    <input
                        type="email"
                        name="correo"
                        placeholder="tu@correo.com"
                        required
                    >
                </div>

               <div class="campo">
                    <label>Nueva contraseña</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="nueva_contrasena"
                            name="nueva_contrasena"
                            placeholder="••••••••"
                            required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="mostrarContraseña('nueva_contrasena', this)"
                    >
                        👁️
                    </button>
                </div>
            </div>

               <div class="campo">
                    <label>Confirmar contraseña</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="confirmar_contrasena"
                            name="confirmar_contrasena"
                            placeholder="••••••••"
                            required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="mostrarContraseña('confirmar_contrasena', this)"
                    >
                        👁️
                    </button>
                </div>
            </div>

                <button type="submit" class="btn-restablecer">
                    Restablecer contraseña
                </button>

            </form>

            <div class="volver">
                <a href="{{ url_for('login') }}">
                    Volver a iniciar sesión
                </a>
            </div>

        </div>

    </div>
    <script>
        function mostrarContraseña(idInput, boton) {
            const input = document.getElementById(idInput);

            if (input.type === "password") {
                input.type = "text";
                boton.innerHTML = "🙈";
            } else {
                input.type = "password";
                boton.innerHTML = "👁️";
            }
        }
    </script>

</body>
</html>
