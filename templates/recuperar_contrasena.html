<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña - GEORGE</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/recuperar.css') }}">

</head>

<body>

    <div class="recuperar-container">

        <div class="recuperar-card">

            <h1>Restablecer contraseña</h1>

            <p class="descripcion">
                Ingresa tu correo electrónico y crea una nueva contraseña.
            </p>


            <!-- FORMULARIO -->

            <form method="POST">

                <!-- CORREO -->

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="tu@correo.com"
                        required
                    >

                </div>


                <!-- NUEVA CONTRASEÑA -->

                <div class="campo">

                    <label for="nueva_contrasena">
                        Nueva contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="nueva_contrasena"
                            name="nueva_contrasena"
                            placeholder="••••••••"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="mostrarPassword('nueva_contrasena', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="campo">

                    <label for="confirmar_contrasena">
                        Confirmar contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmar_contrasena"
                            name="confirmar_contrasena"
                            placeholder="••••••••"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="mostrarPassword('confirmar_contrasena', this)"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-restablecer"
                >
                    Restablecer contraseña
                </button>

            </form>


            <!-- OLVIDÉ MI CONTRASEÑA -->

            <div class="olvide">

                <a href="{{ url_for('olvidar_contrasena') }}">
                    ¿Olvidé mi contraseña?
                </a>

            </div>


            <!-- VOLVER -->

            <div class="volver">

                <a href="{{ url_for('login') }}">
                    Volver a iniciar sesión
                </a>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function mostrarPassword(id, boton) {

            const password = document.getElementById(id);

            if (password.type === "password") {

                password.type = "text";

                boton.textContent = "🙈";

            } else {

                password.type = "password";

                boton.textContent = "👁";

            }

        }

    </script>

</body>

</html>
