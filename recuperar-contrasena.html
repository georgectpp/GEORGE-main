<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='registro.css') }}">
</head>

<body>

    <div class="registro-container">

        <h1>Recuperar contraseña</h1>

        <p>Ingrese una nueva contraseña para su cuenta.</p>

        <form method="POST">

            <div class="campo">
                <label for="password">Nueva contraseña</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <div class="campo">
                <label for="confirm_password">Confirmar contraseña</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit">
                Cambiar contraseña
            </button>

        </form>

    </div>

</body>
</html>
